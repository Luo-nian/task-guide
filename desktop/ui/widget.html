<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务挂件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; user-select: none;
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  .w { position: relative; width: 360px; height: 92px; padding: 10px 14px;
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    background: rgba(255, 253, 248, 0.86);
    backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid rgba(201, 162, 39, 0.38);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(90, 72, 40, 0.16);
    cursor: pointer; }
  .row1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ico { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px;
    background: linear-gradient(135deg, #E8CB7F, #8A6A1C);
    display: flex; align-items: center; justify-content: center; color: #fff; }
  .ico svg { display-width: 12px; height: 12px; }
  .title { font-size: 14px; font-weight: 500; color: #2C2C2A; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .row2 { display: flex; align-items: center; gap: 8px; padding-left: 30px; min-width: 0; }
  .step { flex: 1; font-size: 12px; color: #5F5E5A; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .pbar { flex: 0 0 86px; height: 6px; border-radius: 3px;
    background: rgba(90, 72, 40, 0.12); border: 1px solid rgba(138, 106, 28, 0.16);
    overflow: hidden; }
  .pfill { height: 100%; width: 0%;
    background: linear-gradient(90deg, #7A5516, #B98F2E 55%, #D8B45A 100%);
    border-radius: 3px; transition: width .5s; }
  /* v5.13k：推进键（圆形 chevron-right，点击 = advance_step 推进一步，最后一步触发 complete） */
  .advance {
    flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #D8B45A, #B98F2E);
    color: #FFF4D0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(138, 106, 28, 0.35), inset 0 0 0 1px rgba(255, 244, 208, 0.25);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .advance:hover { transform: scale(1.08); box-shadow: 0 3px 10px rgba(201, 162, 39, 0.5); }
  .advance:active { transform: scale(0.94); }
  .advance svg { display: block; }
  .advance.disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
<div class="w" id="card" data-tauri-drag-region="true">
  <div class="row1">
    <span class="ico" id="ico"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></span>
    <span class="title" id="title">暂无追踪任务</span>
    <!-- v5.14f：多追踪任务切换按钮（3 任务变轮播） -->
    <span class="w-switch" id="wPrev" title="上一个任务" data-tauri-drag-region-exclude>‹</span>
    <span class="w-switch" id="wNext" title="下一个任务" data-tauri-drag-region-exclude>›</span>
  </div>
  <div class="row2">
    <span class="step" id="step">点击打开客户端</span>
    <span class="pbar"><span class="pfill" id="pfill"></span></span>
    <div class="advance disabled" id="advance" title="推进到下一步"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
  </div>
</div>
<script>
(function(){
  const el = {
    title: document.getElementById('title'),
    step: document.getElementById('step'),
    pfill: document.getElementById('pfill'),
    advance: document.getElementById('advance')
  };
  const invoke = (cmd, args) => window.__TAURI__ && window.__TAURI__.core
    ? window.__TAURI__.core.invoke(cmd, args || {})
    : Promise.reject(new Error('no-tauri'));

  let lastKey = '';
  let currentStepUuid = null;  // v5.13k：挂件可推进的 step uuid
  let currentTaskUuid = null;
  let advancing = false;
  async function refresh() {
    try {
      const cards = await invoke('get_track_cards');
      if (!cards || cards.length === 0) {
        el.title.textContent = '暂无追踪任务';
        el.step.textContent = '点击打开客户端';
        el.pfill.style.width = '0%';
        currentStepUuid = null; currentTaskUuid = null;
        el.advance.classList.add('disabled');
        // 隐藏切换按钮
        const prev = document.getElementById('wPrev'); const next = document.getElementById('wNext');
        if (prev) prev.style.display = 'none'; if (next) next.style.display = 'none';
        return;
      }
      // v5.14f：boss 反馈"3 个追踪任务只显示 1 个"——支持多任务切换
      //   保留 widget 92px 高度，加 "< 1/3 >" 切换按钮 + 索引
      if (typeof curCardIdx !== 'number' || curCardIdx >= cards.length) curCardIdx = 0;
      const c = cards[curCardIdx];
      const t = c.task || {};
      const isCountTask = !!(t.count && t.count > 1);
      const total = isCountTask ? t.count : Math.max(c.total_steps || 0, 1);
      const done = isCountTask ? (t.done_count || 0) : (c.total_steps > 0 ? c.done_steps : (t.done_count || 0));
      if (isCountTask) {
        el.step.textContent = '已完成 ' + done + '/' + total;
        // 次数任务：仍允许点击推进（advances 完所有 count 后整个任务 done）
        // 通过 toggleStep 路径推 count（与 step 走相同 advance_step 框架）
        currentStepUuid = null;
        currentTaskUuid = t.uuid;
        el.advance.classList.remove('disabled');
        el.advance.title = '推进 1 次（已 ' + done + '/' + total + '）';
      } else if (c.current_step) {
        el.step.textContent = '步骤 ' + (done + 1) + '/' + total + ' · ' + c.current_step.title;
        currentStepUuid = c.current_step.uuid;
        currentTaskUuid = t.uuid;
        el.advance.classList.remove('disabled');
        el.advance.title = '推进到下一步（' + (done + 1) + '/' + total + '）';
      } else {
        el.step.textContent = '全部已完成';
        currentStepUuid = null; currentTaskUuid = null;
        el.advance.classList.add('disabled');
      }
      const pct = total > 0 ? Math.min(100, Math.max(0, Math.round((done / total) * 100))) : 0;
      const key = t.title + '|' + done + '/' + total;
      if (key !== lastKey) { el.pfill.style.width = pct + '%'; lastKey = key; }
      el.title.textContent = t.title || '任务';
    } catch (e) {
      el.title.textContent = '客户端未启动';
      el.step.textContent = '点击唤起';
      el.pfill.style.width = '0%';
      el.advance.classList.add('disabled');
    }
  }

  // 推进键：步骤化任务调 advance_step，最后一步后端自动 complete + 积分
  // 次数任务：调 complete_task（直接完成+积分，对单次推进体验更直接）
  el.advance.addEventListener('click', async function(ev) {
    ev.stopPropagation();
    if (advancing) return;
    if (!currentTaskUuid) return;
    advancing = true;
    try {
      if (currentStepUuid) {
        await invoke('advance_step', { stepUuid: currentStepUuid, taskUuid: currentTaskUuid, status: 'done' });
      } else {
        // 次数任务：toggleStep-like 路径
        await invoke('complete_task', { taskUuid: currentTaskUuid });
      }
    } catch (e) {
      console.error('推进失败', e);
    }
    advancing = false;
    // 立即本地刷新（不等 5s 轮询）
    await refresh();
  });

  let downX = 0, downY = 0, downT = 0;
  let curCardIdx = 0;    // v5.14f：当前追踪任务索引（多任务轮播）
  let lastKey = '';
  document.getElementById('card').addEventListener('mousedown', function(ev) {
    if (ev.target.closest('.advance')) return;  // 推进键不触发唤起
    downX = ev.screenX; downY = ev.screenY; downT = Date.now();
    // v5.14e：拖动 JS 兜底（WebView2 data-tauri-drag-region 偶发失效——100ms 后若 mousemove > 3px 调 win_start_dragging）
    const startX = ev.screenX, startY = ev.screenY;
    const timer = setTimeout(function() {
      const onMove = function(mv) {
        if (Math.abs(mv.screenX - startX) > 3 || Math.abs(mv.screenY - startY) > 3) {
          clearTimeout(timer);
          document.removeEventListener('mousemove', onMove);
          invoke('win_start_dragging', { label: 'widget' }).catch(function(){});
        }
      };
      document.addEventListener('mousemove', onMove);
    }, 100);
    const cleanup = function() { clearTimeout(timer); };
    document.getElementById('card').addEventListener('mouseup', cleanup, { once: true });
    document.getElementById('card').addEventListener('mouseleave', cleanup, { once: true });
  });
  document.getElementById('card').addEventListener('mouseup', function(ev) {
    if (ev.target.closest('.advance')) return;
    const dx = Math.abs(ev.screenX - downX), dy = Math.abs(ev.screenY - downY);
    if (dx < 5 && dy < 5) invoke('show_main_window').catch(function(){});
  });
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    invoke('hide_widget').catch(function(){});
  });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
