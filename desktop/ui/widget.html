<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务挂件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; user-select: none;
    font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
  .w { position: relative; width: 360px; max-height: 360px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(255, 253, 248, 0.86);
    backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid rgba(201, 162, 39, 0.38);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(90, 72, 40, 0.16);
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; scrollbar-color: #C9A227 transparent; }
  .w::-webkit-scrollbar { width: 4px; }
  .w::-webkit-scrollbar-thumb { background: #C9A227; border-radius: 2px; }
  /* 空态 */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 92px; gap: 4px; cursor: pointer; color: #8A7E5A; font-size: 12px; }
  /* 单任务行 */
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 6px;
    border-radius: 10px; cursor: pointer; transition: background 0.12s; }
  .row:hover { background: rgba(201, 162, 39, 0.08); }
  .ico { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px;
    background: linear-gradient(135deg, #E8CB7F, #8A6A1C);
    display: flex; align-items: center; justify-content: center; color: #fff; }
  .ico svg { width: 14px; height: 14px; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .title { font-size: 13px; font-weight: 500; color: #2C2C2A; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .step { font-size: 11px; color: #5F5E5A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.3; }
  .pbar { flex: 0 0 80px; height: 5px; border-radius: 3px;
    background: rgba(90, 72, 40, 0.12); border: 1px solid rgba(138, 106, 28, 0.16); overflow: hidden; }
  .pfill { height: 100%; width: 0%;
    background: linear-gradient(90deg, #7A5516, #B98F2E 55%, #D8B45A 100%);
    border-radius: 3px; transition: width .4s; }
  /* v5.13k：推进键（圆形 chevron-right，点击 = advance_step） */
  .advance { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #D8B45A, #B98F2E);
    color: #FFF4D0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(138, 106, 28, 0.35), inset 0 0 0 1px rgba(255, 244, 208, 0.25);
    transition: transform 0.12s, box-shadow 0.12s; }
  .advance:hover { transform: scale(1.08); box-shadow: 0 3px 10px rgba(201, 162, 39, 0.5); }
  .advance:active { transform: scale(0.94); }
  .advance svg { display: block; }
  .advance.disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
<div class="w" id="card" data-tauri-drag-region="true">
  <div class="empty" id="empty" title="点击打开客户端">暂无追踪任务<br>点击打开客户端</div>
<script>
(function(){
  const cardEl = document.getElementById('card');
  const emptyEl = document.getElementById('empty');
  const invoke = (cmd, args) => window.__TAURI__ && window.__TAURI__.core
    ? window.__TAURI__.core.invoke(cmd, args || {})
    : Promise.reject(new Error('no-tauri'));

  let lastKey = '';
  const ICONS = {
    diamond: '<circle cx="12" cy="12" r="9"/><path d="M12 3l4 4-4 4-4-4z" fill="currentColor" stroke="none"/>'
  };
  function svg(name) {
    const body = ICONS[name] || ICONS.diamond;
    return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
  }

  // 单任务行构造
  function rowHtml(c, idx) {
    const t = c.task || {};
    const isCountTask = !!(t.count && t.count > 1);
    const total = isCountTask ? t.count : Math.max(c.total_steps || 0, 1);
    const done = isCountTask ? (t.done_count || 0) : (c.total_steps > 0 ? c.done_steps : (t.done_count || 0));
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    // v5.14h.13：区分「未拆步骤 / 推进中 / 全完成」——避免无步骤任务误显"全部已完成"
    let stepTxt, canAdvance = false;
    if (isCountTask) { stepTxt = '已完成 ' + done + '/' + total; canAdvance = done < total; }
    else if (c.total_steps === 0) { stepTxt = '（尚未拆解步骤）'; canAdvance = false; }
    else if (done >= c.total_steps) { stepTxt = '全部已完成'; canAdvance = false; }
    else if (c.current_step) { stepTxt = '步骤 ' + (done + 1) + '/' + c.total_steps + ' · ' + c.current_step.title; canAdvance = true; }
    else { stepTxt = '已推进 ' + done + '/' + c.total_steps; canAdvance = false; }
    return `
      <div class="row" data-idx="${idx}" data-step-uuid="${c.current_step?.uuid || ''}" data-task-uuid="${t.uuid || ''}" data-is-count="${isCountTask ? 1 : 0}">
        <span class="ico">${svg('diamond')}</span>
        <div class="info">
          <div class="title">${(t.title || '任务').replace(/</g, '&lt;')}</div>
          <div class="step">${stepTxt.replace(/</g, '&lt;')}</div>
        </div>
        <div class="pbar"><span class="pfill" style="width:${pct}%"></span></div>
        <div class="advance ${canAdvance ? '' : 'disabled'}" title="${canAdvance ? '推进到下一步' : '已完成'}"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>`;
  }

  let cards = [];
  // v5.14h.13：按追踪任务数动态伸缩整个窗（行数不变不调 set_size，避免拖动/轮询跳动）
  let lastRows = -1;
  function autoFitHeight(n) {
    if (n === lastRows) return;
    lastRows = n;
    const h = n === 0 ? 96 : Math.min(360, 12 + n * 44 + 8);  // 每行 44px + 上下 padding
    invoke('set_window_size', { w: 360, h }).catch(function(){});
  }
  async function refresh() {
    try {
      cards = await invoke('get_track_cards');
      autoFitHeight(cards ? cards.length : 0);
    if (!cards || cards.length === 0) {
        cardEl.innerHTML = '<div class="empty" id="empty" title="点击打开客户端">暂无追踪任务<br>点击打开客户端</div>';
        bindCardEvents();
        lastKey = '';
        return;
      }
      const sig = cards.map(c => (c.task?.uuid || '') + ':' + (c.task?.done_count || 0) + '/' + (c.task?.count || c.total_steps || 0)).join('|');
      if (sig === lastKey) return;
      lastKey = sig;
      cardEl.innerHTML = cards.map((c, i) => rowHtml(c, i)).join('');
      bindCardEvents();
    } catch (e) {
      cardEl.innerHTML = '<div class="empty" id="empty">客户端未启动</div>';
      bindCardEvents();
    }
  }

  function bindCardEvents() {
    // 单击行 → 唤起主窗（区分拖动）
    cardEl.querySelectorAll('.row').forEach(row => {
      let downX = 0, downY = 0, downT = 0;
      row.addEventListener('mousedown', function(ev) {
        if (ev.target.closest('.advance')) return;
        downX = ev.screenX; downY = ev.screenY; downT = Date.now();
        const startX = ev.screenX, startY = ev.screenY;
        const timer = setTimeout(function() {
          const onMove = function(mv) {
            if (Math.abs(mv.screenX - startX) > 3 || Math.abs(mv.screenY - startY) > 3) {
              clearTimeout(timer);
              cardEl.removeEventListener('mousemove', onMove);
              invoke('win_start_dragging', { label: 'widget' }).catch(function(){});
            }
          };
          cardEl.addEventListener('mousemove', onMove);
        }, 100);
        const cleanup = function() { clearTimeout(timer); };
        row.addEventListener('mouseup', cleanup, { once: true });
        row.addEventListener('mouseleave', cleanup, { once: true });
      });
      row.addEventListener('mouseup', function(ev) {
        if (ev.target.closest('.advance')) return;
        if (Math.abs(ev.screenX - downX) < 5 && Math.abs(ev.screenY - downY) < 5) {
          invoke('show_main_window').catch(function(){});
        }
      });
      // 单击推进键 → advance_step / complete_task
      const adv = row.querySelector('.advance');
      if (adv) {
        adv.addEventListener('click', async function(ev) {
          ev.stopPropagation();
          if (adv.classList.contains('disabled')) return;
          const taskUuid = row.dataset.taskUuid;
          const stepUuid = row.dataset.stepUuid;
          const isCount = row.dataset.isCount === '1';
          try {
            if (stepUuid) {
              await invoke('advance_step', { stepUuid, taskUuid, status: 'done' });
            } else if (isCount) {
              await invoke('complete_task', { taskUuid });
            }
          } catch (e) { console.error('推进失败', e); }
          await refresh();
        });
      }
    });
    // 空态点击唤起主窗
    const emptyEl = document.getElementById('empty');
    if (emptyEl) {
      let dX = 0, dY = 0;
      emptyEl.addEventListener('mousedown', function(ev) { dX = ev.screenX; dY = ev.screenY; });
      emptyEl.addEventListener('mouseup', function(ev) {
        if (Math.abs(ev.screenX - dX) < 5 && Math.abs(ev.screenY - dY) < 5) invoke('show_main_window').catch(function(){});
      });
    }
  }

  // 卡片整体 mousedown 兜底拖动（空态 + 全局）
  let cardDownX = 0, cardDownY = 0;
  cardEl.addEventListener('mousedown', function(ev) {
    cardDownX = ev.screenX; cardDownY = ev.screenY;
    // 空态时由 emptyEl 处理唤起；非空态由 .row 处理
  });

  // 右键隐藏
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    invoke('hide_widget').catch(function(){});
  });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</div>
</body>
</html>
