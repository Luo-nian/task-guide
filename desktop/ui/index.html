<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务指南</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="widget" id="app">

  <!-- ===== 顶部状态栏（双模式共用） ===== -->
  <header class="topbar" data-tauri-drag-region>
    <div class="title">◆ 任务指南</div>
    <div class="top-right">
      <span class="points" id="totalPoints">◆ 0</span>
      <div class="mode-switch">
        <button class="mode-btn" data-mode="top" title="置顶">📌</button>
        <button class="mode-btn" data-mode="normal" title="普通">🖼</button>
        <button class="mode-btn" data-mode="tray" title="最小化到托盘">📥</button>
      </div>
    </div>
  </header>

  <!-- 下一个提醒横幅（图1：新任务提示风格） -->
  <div class="banner" id="reminderBanner" style="display:none"></div>

  <!-- 连接栏 -->
  <div class="connect-bar" id="connectBar">
    <input id="serverUrl" placeholder="手机IP:端口 (如 192.168.43.1:8899)" />
    <button id="connectBtn">连接</button>
  </div>

  <!-- ===== 模式一：追踪条模式（图2 悬浮框，默认） ===== -->
  <div id="trackMode" class="mode-track">
    <div class="section-head">
      <span class="section-title">进行中</span>
      <span class="section-count" id="trackCount">0</span>
      <button class="expand-btn" id="expandBtn" title="展开面板">◤</button>
    </div>
    <div id="miniTrackList" class="track-list"></div>
    <div class="track-footer">
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-text" id="progressText">0/0</span>
      </div>
    </div>
  </div>

  <!-- ===== 模式二：详情面板（图1 左右分栏，点击展开） ===== -->
  <div id="fullMode" class="mode-full" style="display:none">
    <div class="full-layout">
      <!-- 左导航列（分类图标，图1左侧竖导航） -->
      <nav class="side-nav">
        <div class="nav-item active" data-nav="tracking" title="进行中"><span class="nav-ico flag">⚑</span></div>
        <div class="nav-item" data-nav="today" title="今日任务"><span class="nav-ico diamond">◆</span></div>
        <div class="nav-item" data-nav="habits" title="习惯"><span class="nav-ico check">✓</span></div>
      </nav>
      <!-- 任务列表区 -->
      <div class="list-pane">
        <div id="fullTaskList"></div>
      </div>
      <!-- 详情区 -->
      <div class="detail-pane" id="detailPane">
        <div class="detail-empty">选择左侧任务查看详情</div>
      </div>
    </div>
  </div>

  <!-- 快捷添加（双模式共用） -->
  <div class="quick-add">
    <input id="quickInput" placeholder="速记一条任务…" />
    <button id="quickAddBtn">＋</button>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
