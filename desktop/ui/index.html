<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务栏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="widget" id="app">

  <!-- ===== 顶部状态栏 ===== -->
  <header class="topbar" data-tauri-drag-region>
    <div class="title">◆ 任务栏</div>
    <div class="top-right">
      <span class="points" id="totalPoints" title="总积分">◆ 0</span>
      <button class="ico-btn" id="settingsBtn" title="设置">⚙</button>
      <div class="mode-switch">
        <button class="mode-btn" data-mode="top" title="置顶">📌</button>
        <button class="mode-btn" data-mode="normal" title="普通">🖼</button>
        <button class="mode-btn" data-mode="tray" title="托盘">📥</button>
      </div>
    </div>
  </header>

  <!-- ===== 紧急任务弹窗（图3，48h内/36h档） ===== -->
  <div class="emergency-overlay" id="emergencyOverlay" style="display:none">
    <div class="emergency-modal">
      <div class="em-bar"><span class="em-alert">⚠</span><span class="em-title">任务即将超时</span><button class="em-close" id="emClose">×</button></div>
      <div class="em-body">
        <div class="em-task" id="emTaskName"></div>
        <div class="em-msg">您有一个任务即将超时，请尽快完成或处理</div>
        <div class="em-count" id="emCountdown"></div>
      </div>
      <div class="em-foot">
        <button class="em-btn secondary" id="emLater">稍后</button>
        <button class="em-btn primary" id="emOpen">立即处理</button>
      </div>
    </div>
  </div>

  <!-- ===== 设置抽屉 ===== -->
  <div class="overlay" id="settingsOverlay" style="display:none">
    <div class="modal settings-modal">
      <div class="m-head"><span>⚙ 设置</span><button class="m-close" data-close-overlay="settingsOverlay">×</button></div>
      <div class="m-body">
        <div class="setting-row">
          <label>追踪上限</label>
          <input type="number" id="setTrackingMax" min="1" max="20" />
          <span class="hint">可同时追踪的任务数（默认 3）</span>
        </div>
        <div class="setting-row">
          <label>紧急提醒</label>
          <label class="switch"><input type="checkbox" id="setEmergencyOn" /><span class="slider"></span></label>
        </div>
        <div class="setting-row">
          <label>≤48h 提醒</label>
          <input type="number" id="setEtaShort" min="1" max="100" />
          <span class="hint">% of 总时长（默认 30 = 3/10）</span>
        </div>
        <div class="setting-row">
          <label>&gt;48h 提前提醒</label>
          <input type="number" id="setEtaLong" min="1" max="240" />
          <span class="hint">小时（默认 36）</span>
        </div>
        <div class="setting-row">
          <label>配对状态</label>
          <span class="hint" id="setPairingStatus">未配对</span>
          <button class="small-btn" id="setUnpair">解除配对</button>
        </div>
        <div class="setting-row">
          <label>配对服务器</label>
          <input type="text" id="setPairInput" placeholder="手机IP:端口" />
          <button class="small-btn primary" id="setPairBtn">连接</button>
        </div>
        <div class="setting-row">
          <label>关于</label>
          <span class="hint">任务栏 · 原神式任务追踪 · v3</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 新建任务表单抽屉 ===== -->
  <div class="overlay" id="addOverlay" style="display:none">
    <div class="modal add-modal">
      <div class="m-head"><span>＋ 新建任务</span><button class="m-close" data-close-overlay="addOverlay">×</button></div>
      <div class="m-body">
        <label class="label">任务名</label>
        <input type="text" id="addTitle" placeholder="例：每日锻炼" />

        <label class="label">任务分类 <span class="must">*</span></label>
        <div class="cat-row" id="addCatRow">
          <button type="button" class="cat-btn" data-cat="daily">每日任务</button>
          <button type="button" class="cat-btn" data-cat="goal">目标任务</button>
          <button type="button" class="cat-btn" data-cat="time-limited">限时任务</button>
          <button type="button" class="cat-btn" data-cat="once">小任务（单次）</button>
        </div>
        <span class="hint" id="addCatHint">请选择一个分类</span>

        <label class="label">限时时长（所有任务都可设置）</label>
        <div class="deadline-row">
          <button type="button" class="ddl-btn" data-ddl="none">不限</button>
          <button type="button" class="ddl-btn" data-ddl="60min">1 小时</button>
          <button type="button" class="ddl-btn" data-ddl="6h">6 小时</button>
          <button type="button" class="ddl-btn" data-ddl="1d">1 天</button>
          <button type="button" class="ddl-btn" data-ddl="3d">3 天</button>
          <button type="button" class="ddl-btn" data-ddl="7d">7 天</button>
          <button type="button" class="ddl-btn" data-ddl="30d">30 天</button>
        </div>

        <label class="label">优先级</label>
        <div class="prio-row">
          <button type="button" class="prio-btn" data-prio="high">高</button>
          <button type="button" class="prio-btn" data-prio="medium">中</button>
          <button type="button" class="prio-btn" data-prio="low">低</button>
        </div>

        <div class="action-row">
          <button class="ghost" data-close-overlay="addOverlay">取消</button>
          <button class="primary" id="addSubmit">创建</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 侧栏（左导航：分类 + 仓库） ===== -->
  <div class="side-nav" id="sideNav">
    <button class="nav-item active" data-nav="overview" title="总览"><span class="ico">◉</span></button>
    <button class="nav-item" data-nav="tracking" title="追踪中"><span class="ico">⚑</span></button>
    <button class="nav-item" data-nav="today" title="今日"><span class="ico">◆</span></button>
    <button class="nav-item" data-nav="habits" title="习惯"><span class="ico">✓</span></button>
    <div class="nav-spacer"></div>
    <button class="nav-item repo" data-nav="archive" title="仓库（已完成）"><span class="ico">▣</span></button>
  </div>

  <!-- ===== 主内容 ===== -->
  <div class="main-pane">
    <!-- 总览默认页：4 个分类卡片 -->
    <section class="view overview-view" id="overviewView">
      <div class="view-head">
        <span class="vh-title">总览</span>
        <span class="vh-hint" id="overviewHint">每日 / 目标 / 限时 / 单次</span>
      </div>
      <div class="cat-grid">
        <div class="cat-card" data-cat="daily">
          <div class="cc-head"><span class="cc-ico daily">◆</span><span class="cc-name">每日任务</span><span class="cc-count" id="cDaily">0</span></div>
          <div class="cc-list" id="listDaily"></div>
        </div>
        <div class="cat-card" data-cat="goal">
          <div class="cc-head"><span class="cc-ico goal">◎</span><span class="cc-name">目标任务</span><span class="cc-count" id="cGoal">0</span></div>
          <div class="cc-list" id="listGoal"></div>
        </div>
        <div class="cat-card" data-cat="time-limited">
          <div class="cc-head"><span class="cc-ico lim">⏱</span><span class="cc-name">限时任务</span><span class="cc-count" id="cLim">0</span></div>
          <div class="cc-list" id="listLim"></div>
        </div>
        <div class="cat-card" data-cat="once">
          <div class="cc-head"><span class="cc-ico once">●</span><span class="cc-name">小任务（单次）</span><span class="cc-count" id="cOnce">0</span></div>
          <div class="cc-list" id="listOnce"></div>
        </div>
      </div>
    </section>

    <!-- 追踪中 / 今日 / 习惯 / 仓库 通用列表 -->
    <section class="view list-view" id="listView" style="display:none">
      <div class="view-head">
        <span class="vh-title" id="listViewTitle">追踪中</span>
        <span class="vh-hint" id="listViewHint"></span>
        <input class="search" id="archiveSearch" placeholder="检索已完成任务…" style="display:none" />
      </div>
      <div class="lv-body" id="listViewBody"></div>
    </section>

    <!-- 详情面板 -->
    <section class="view detail-view" id="detailView" style="display:none">
      <div class="dv-head">
        <button class="dv-back" id="detailBack">◀</button>
        <span class="dv-title" id="detailTitle">任务详情</span>
      </div>
      <div class="dv-body" id="detailBody"></div>
    </section>
  </div>

  <!-- ===== 折叠态：单条（图4 平时挂件）—— 顶级，独立于 main-pane ===== -->
  <section class="view folded-view" id="foldedView" style="display:none">
    <div class="folded-bar" id="foldedBar" title="点击展开总览"></div>
  </section>

  <!-- ===== 底部 FAB ===== -->
  <button class="fab" id="fabAdd" title="新建任务">＋</button>

  <!-- ===== 折叠/展开按钮（顶栏） ===== -->
  <button class="fold-btn" id="foldBtn" title="折叠/展开">◣</button>

  <!-- ===== 上下文菜单（追踪/完成/取消） ===== -->
  <div class="ctx-menu" id="ctxMenu" style="display:none">
    <button data-cmd="track">开始追踪</button>
    <button data-cmd="untrack">取消追踪</button>
    <button data-cmd="complete">标记完成</button>
    <button data-cmd="delete" class="danger">删除</button>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
